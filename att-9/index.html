<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Sistema de Atendimento</title>


    <style>

        body {
            font-family: Arial, sans-serif;
            background-color: #f2f2f2;
            margin: 0;
            padding: 30px;
        }


        .container {
            max-width: 700px;
            margin: 30px auto;
            background-color: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 0 10px #ccc;
        }


        h1 {
            text-align: center;
            color: #333;
        }


        label {
            display: block;
            margin-top: 15px;
            margin-bottom: 5px;
            font-weight: bold;
        }


        input {
            width: 100%;
            padding: 12px;
            box-sizing: border-box;
            border: 1px solid #ccc;
            border-radius: 5px;
            font-size: 16px;
        }


        .botoes {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            margin-top: 15px;
        }


        button {
            padding: 12px 18px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            color: white;
            font-size: 14px;
        }


        button:hover {
            opacity: 0.85;
        }


        .btn-adicionar {
            background-color: #007bff;
        }


        .btn-chamar {
            background-color: #28a745;
        }


        .btn-proximo {
            background-color: #ffc107;
            color: black;
        }


        .btn-fila {
            background-color: #6f42c1;
        }


        #mensagem {
            margin-top: 20px;
            padding: 15px;
            border-radius: 5px;
            font-weight: bold;
        }


        #proximo {
            margin-top: 20px;
            padding: 20px;
            background-color: #fff3cd;
            border-radius: 5px;
        }


        #fila {
            margin-top: 20px;
            padding: 20px;
            background-color: #f8f9fa;
            border-radius: 5px;
        }


        .pessoa {
            padding: 15px;
            margin: 8px 0;
            background-color: white;
            border-left: 5px solid #007bff;
            border-radius: 5px;
        }


        .primeiro {
            border-left-color: #28a745;
            background-color: #e8f5e9;
        }


        #quantidade {
            margin-top: 20px;
            padding: 15px;
            background-color: #e9ecef;
            border-radius: 5px;
            font-size: 18px;
            font-weight: bold;
            text-align: center;
        }


        @media (max-width: 600px) {

            .botoes {
                flex-direction: column;
            }

            .botoes button {
                width: 100%;
            }

        }

    </style>

</head>


<body>


    <div class="container">


        <h1>Sistema de Atendimento</h1>


        <label for="nome">
            Nome da pessoa:
        </label>


        <input
            type="text"
            id="nome"
            placeholder="Digite o nome"
        >


        <div class="botoes">

            <button
                class="btn-adicionar"
                onclick="adicionarPessoa()"
            >
                Adicionar à fila
            </button>


            <button
                class="btn-chamar"
                onclick="chamarProxima()"
            >
                Chamar próxima
            </button>


            <button
                class="btn-proximo"
                onclick="consultarProximo()"
            >
                Consultar próximo
            </button>


            <button
                class="btn-fila"
                onclick="mostrarFila()"
            >
                Mostrar fila
            </button>

        </div>


        <div id="mensagem">
        </div>


        <div id="proximo">

            <strong>
                Próxima pessoa:
            </strong>

            <p>
                Ninguém está aguardando.
            </p>

        </div>


        <div id="fila">

            <strong>
                Pessoas aguardando:
            </strong>

            <p>
                A fila está vazia.
            </p>

        </div>


        <div id="quantidade">

            Pessoas aguardando: 0

        </div>


    </div>


    <script>



        let fila = [];


        let proximaSenha = 1;



      

        function adicionarPessoa() {


            const campoNome =
                document.getElementById("nome");


            const nome =
                campoNome.value.trim();


            if (nome === "") {

                mostrarMensagem(
                    "Digite o nome da pessoa.",
                    "red"
                );

                return;
            }


            const horario =
                new Date().toLocaleTimeString("pt-BR");


            const pessoa = {

                senha: proximaSenha,

                nome: nome,

                horario: horario

            };


            fila.push(pessoa);


            proximaSenha++;


            campoNome.value = "";


            mostrarMensagem(
                "Pessoa adicionada à fila! Senha: " +
                pessoa.senha,
                "green"
            );


            atualizarTela();

        }



        function chamarProxima() {


            if (fila.length === 0) {

                mostrarMensagem(
                    "Não há pessoas aguardando.",
                    "red"
                );

                return;
            }


            const pessoa =
                fila.shift();


            mostrarMensagem(
                "Chamando senha " +
                pessoa.senha +
                " - " +
                pessoa.nome,
                "green"
            );


            atualizarTela();

        }



        function consultarProximo() {


            const elemento =
                document.getElementById("proximo");


            if (fila.length === 0) {

                elemento.innerHTML = `

                    <strong>
                        Próxima pessoa:
                    </strong>

                    <p>
                        Ninguém está aguardando.
                    </p>

                `;

                return;
            }


            const pessoa =
                fila[0];


            elemento.innerHTML = `

                <strong>
                    Próxima pessoa:
                </strong>

                <p>

                    <strong>
                        Senha:
                    </strong>

                    ${pessoa.senha}

                    <br>

                    <strong>
                        Nome:
                    </strong>

                    ${pessoa.nome}

                    <br>

                    <strong>
                        Entrada:
                    </strong>

                    ${pessoa.horario}

                </p>

            `;

        }

        function mostrarFila() {


            const elemento =
                document.getElementById("fila");


            if (fila.length === 0) {

                elemento.innerHTML = `

                    <strong>
                        Pessoas aguardando:
                    </strong>

                    <p>
                        A fila está vazia.
                    </p>

                `;

                return;
            }


            let html = `

                <strong>
                    Pessoas aguardando:
                </strong>

            `;


            fila.forEach(
                function(pessoa, indice) {


                    let classe = "";


                    if (indice === 0) {
                        classe = "primeiro";
                    }


                    html += `

                        <div
                            class="pessoa ${classe}"
                        >

                            <strong>
                                ${indice + 1}º da fila
                            </strong>

                            <br><br>

                            <strong>
                                Senha:
                            </strong>

                            ${pessoa.senha}

                            <br>

                            <strong>
                                Nome:
                            </strong>

                            ${pessoa.nome}

                            <br>

                            <strong>
                                Horário de entrada:
                            </strong>

                            ${pessoa.horario}

                            ${
                                indice === 0
                                ? "<br><br><strong>← PRÓXIMO</strong>"
                                : ""
                            }

                        </div>

                    `;

                }
            );


            elemento.innerHTML = html;

        }





        function atualizarQuantidade() {


            const elemento =
                document.getElementById("quantidade");


            elemento.textContent =
                "Pessoas aguardando: " +
                fila.length;

        }




        function atualizarTela() {

            atualizarQuantidade();

            consultarProximo();

            mostrarFila();

        }




        function mostrarMensagem(
            texto,
            cor
        ) {


            const elemento =
                document.getElementById("mensagem");


            elemento.textContent =
                texto;


            elemento.style.color =
                cor;

        }



   
        document
            .getElementById("nome")
            .addEventListener(
                "keypress",
                function(event) {

                    if (event.key === "Enter") {

                        adicionarPessoa();

                    }

                }
            );


        atualizarTela();

    </script>

</body>

</html>
